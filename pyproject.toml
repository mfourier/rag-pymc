[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pymc"
version = "0.1.0"
description = "An evidence-grounded expert assistant for Bayesian statistics and PyMC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "arviz==1.2.0",
  "beautifulsoup4==4.15.0",
  "h5netcdf==1.8.1",
  "h5py==3.16.0",
  "pydantic==2.13.4",
  "pymc==6.1.0",
  "pytensor==3.1.3",
  "typer==0.27.0",
  "xarray==2026.2.0",
]

[project.scripts]
rag-pymc = "rag_pymc.cli:app"
rag-pymc-research = "rag_pymc.research_cli:app"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
rag_pymc = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "datasets/fixtures/pymc/*/notebooks/**",
  "datasets/fixtures/pymc/*/repository/**",
]
force-exclude = true

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests", ".agents/skills"]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=rag_pymc",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=84",
]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["rag_pymc"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
